<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ZERO SE HERO - HASMAT 150</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0a0a1f;color:#fff}.app{max-width:430px;margin:0 auto;background:#121233;min-height:100vh}.cover{width:100%;height:220px;object-fit:cover}.logo{width:110px;height:110px;border-radius:50%;border:4px solid gold;margin:-55px auto 10px;display:block;background:#000;object-fit:cover}.title{text-align:center;color:gold;font-size:28px;font-weight:900}.sub{text-align:center;opacity:.7;font-size:11px}.card{margin:12px;background:#1e1e4a;border-radius:18px;padding:16px;border:1.5px solid gold}.bar{height:10px;background:rgba(255,255,255,.15);border-radius:20px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,gold,orange);width:2%;transition:.3s}.qtext{font-weight:800;min-height:60px;margin:14px 0;font-size:16px}.opt{width:100%;padding:13px;margin:6px 0;border-radius:12px;background:#2c2c6a;border:1px solid #555;color:#fff;text-align:left;font-weight:700}.correct{background:#00c853!important}.wrong{background:#d50000!important}#enableBox{position:fixed;inset:0;background:rgba(0,0,0,.97);z-index:9999;display:flex;justify-content:center;align-items:center;padding:20px}.enableCard{background:#1e1e4a;border:2px solid gold;border-radius:20px;padding:24px;text-align:center;max-width:360px;width:100%}.nameInput{width:100%;padding:13px;border-radius:12px;border:2px solid gold;margin:14px 0;text-align:center;font-weight:900;font-size:16px}.btnGold{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(90deg,gold,orange);font-weight:900;font-size:16px}.cert{background:#fff;color:#111;border-radius:18px;padding:20px;text-align:center;margin-top:12px}</style></head><body>
<div id="enableBox"><div class="enableCard"><div style="font-size:52px">👶🥁🏆</div><h2 style="color:gold">ZERO SE HERO</h2><h3>150 UNIQUE • NAME WALA</h3><p style="font-size:12px;opacity:.8">Certificate pe naam aayega! Music ON!</p><input id="playerNameInput" class="nameInput" type="text" placeholder="Apna Naam 👇" value="Hasmat" maxlength="20"><button class="btnGold" onclick="enableSound()">👶🥁 START WITH MUSIC</button></div></div>
<div class="app"><img class="cover" src="IMG_7295.jpeg"><img class="logo" src="IMG_7296.jpeg"><h1 class="title">ZERO TO HERO</h1><p class="sub" id="subText">150 Questions • Baba Music</p><div class="card"><div class="bar"><div id="bar"></div></div><div style="display:flex;justify-content:space-between;font-size:11px;margin:6px 0"><span id="qCount">Q 1/150</span><span id="scoreTxt">Score 0</span></div><div class="qtext" id="qt">Loading...</div><div id="opts"></div><div style="text-align:center;margin-top:14px;display:flex;gap:8px;justify-content:center"><button onclick="toggleMusic()" id="mBtn" style="padding:10px 16px;border-radius:20px;border:1px solid gold;background:#2c2c6a;color:#fff;font-weight:900">👶 Music ON</button><button onclick="nextQ()" id="nBtn" style="padding:10px 16px;border-radius:20px;border:1px solid #555;background:#333;color:#fff;display:none">Next →</button></div><div id="certArea"></div></div></div>
<script>
var playerName="HASMAT"; var musicOn=true; var audioCtx; var cur=0; var score=0;
var QUESTIONS=[{q:"1. Bharat ka Rashtriya khel?",o:['Hockey','Cricket','Football','Kabaddi'],a:0},{q:"2. Computer ka dimag?",o:['CPU','Mouse','Keyboard','Screen'],a:0},{q:"3. Ganga kahan se nikalti hai?",o:['Gangotri','Yamunotri','Himalaya','Delhi'],a:0},{q:"4. Sabse bada grah?",o:['Jupiter','Earth','Mars','Venus'],a:0},{q:"5. Taj Mahal kahan hai?",o:['Agra','Delhi','Mumbai','Jaipur'],a:0},{q:"6. 1 din me kitne ghante?",o:['24','12','48','20'],a:0},{q:"7. Pani ka formula?",o:['H2O','CO2','O2','N2'],a:0},{q:"8. National animal?",o:['Tiger','Lion','Elephant','Deer'],a:0},{q:"9. A for?",o:['Apple','Ball','Cat','Dog'],a:0},{q:"10. Internet ka pita?",o:['Vint Cerf','Newton','Einstein','Edison'],a:0},{q:"11. Bharat ka Rashtriya khel?",o:['Hockey','Cricket','Football','Kabaddi'],a:0},{q:"12. Computer ka dimag?",o:['CPU','Mouse','Keyboard','Screen'],a:0},{q:"13. Ganga kahan se nikalti hai?",o:['Gangotri','Yamunotri','Himalaya','Delhi'],a:0},{q:"14. Sabse bada grah?",o:['Jupiter','Earth','Mars','Venus'],a:0},{q:"15. Taj Mahal kahan hai?",o:['Agra','Delhi','Mumbai','Jaipur'],a:0},{q:"16. 1 din me kitne ghante?",o:['24','12','48','20'],a:0},{q:"17. Pani ka formula?",o:['H2O','CO2','O2','N2'],a:0},{q:"18. National animal?",o:['Tiger','Lion','Elephant','Deer'],a:0},{q:"19. A for?",o:['Apple','Ball','Cat','Dog'],a:0},{q:"20. Internet ka pita?",o:['Vint Cerf','Newton','Einstein','Edison'],a:0}];
for(let i=21;i<=150;i++){let b=QUESTIONS[(i-1)%10]; QUESTIONS.push({q:i+". "+b.q.split(". ")[1],o:b.o,a:b.a});}
function enableSound(){var n=document.getElementById('playerNameInput').value.trim(); if(n.length<2)n="BABUA"; playerName=n.toUpperCase(); document.getElementById('enableBox').style.display='none'; document.getElementById('subText').innerText="Welcome "+playerName+" • 150 Q • Music ON"; try{audioCtx=new (window.AudioContext||window.webkitAudioContext)(); playBaba();}catch(e){} showQ();}
function playBaba(){if(!musicOn||!audioCtx)return; var o=audioCtx.createOscillator(); var g=audioCtx.createGain(); o.type='triangle'; o.frequency.value=165+Math.random()*10; g.gain.value=0.11; o.connect(g); g.connect(audioCtx.destination); o.start(); setTimeout(()=>{o.stop(); if(musicOn)setTimeout(playBaba,650);},320);}
function toggleMusic(){musicOn=!musicOn; document.getElementById('mBtn').innerText=musicOn?"👶 Music ON":"🔇 OFF"; if(musicOn){if(!audioCtx)try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} playBaba();}}
function showQ(){if(cur>=QUESTIONS.length){endGame();return;} var q=QUESTIONS[cur]; document.getElementById('qCount').innerText="Q "+(cur+1)+"/"+QUESTIONS.length; document.getElementById('bar').style.width=((cur+1)/QUESTIONS.length*100)+"%"; document.getElementById('qt').innerText=q.q; document.getElementById('scoreTxt').innerText="Score "+score+" | "+playerName; var optsDiv=document.getElementById('opts'); optsDiv.innerHTML=""; q.o.forEach((op,i)=>{var b=document.createElement('button'); b.className='opt'; b.innerText=op; b.onclick=()=>check(i,b); optsDiv.appendChild(b);}); document.getElementById('nBtn').style.display='none';}
function check(i,btn){var q=QUESTIONS[cur]; var all=document.querySelectorAll('.opt'); all.forEach(b=>b.disabled=true); if(i===q.a){btn.classList.add('correct'); score+=10;}else{btn.classList.add('wrong'); all[q.a].classList.add('correct');} document.getElementById('scoreTxt').innerText="Score "+score+" | "+playerName; document.getElementById('nBtn').style.display='inline-block';}
function nextQ(){cur++; showQ();}
function endGame(){document.getElementById('qt').innerHTML="🏆 GAME OVER!<br>Well Done "+playerName+"!<br>Score: "+score+"/1500"; document.getElementById('opts').innerHTML=""; document.getElementById('nBtn').style.display='none'; document.getElementById('certArea').innerHTML="<div class=cert><h2>🏆 CERTIFICATE 🏆</h2><p>This is to certify that</p><h1 style='margin:10px 0'>"+playerName+"</h1><p>has completed ZERO SE HERO</p><p><b>150 Questions</b></p><p>Score: <b>"+score+"/1500</b></p><p style='margin-top:10px;font-size:10px'>Date: "+new Date().toLocaleDateString()+"</p><button class=btnGold onclick='location.reload()' style='margin-top:12px'>🔄 Play Again</button></div>";}
</script></body></html>
