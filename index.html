<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>150 UNIQUE - NAME WALA</title>
<style>
body{margin:0;background:#0a0a23;color:#fff;font-family:system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh}
#enableBox{position:fixed;inset:0;background:#0a0a23;display:flex;justify-content:center;align-items:center;z-index:9999}
.card{background:#1a1a4a;border:3px solid #ffeb3b;border-radius:20px;padding:24px;width:90%;max-width:360px;text-align:center}
input{width:100%;padding:14px;border-radius:10px;border:none;text-align:center;font-size:18px;font-weight:700;margin:12px 0}
.btn{background:#ffeb3b;color:#000;border:none;padding:14px 20px;border-radius:12px;font-weight:900;font-size:16px;width:100%}
#quizBox{display:none;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="enableBox">
<div class="card">
<div style="font-size:40px">👶🥁🏆</div>
<h2 style="color:#ffeb3b">150 UNIQUE •<br>NAME WALA</h2>
<p>Certificate pe tera naam ayega! Naam likh ke START dabao</p>
<input id="playerNameInput" value="Hasmat">
<button class="btn" onclick="enableSound()">👶🥁 START - NAAM KE SAATH!</button>
</div>
</div>
<div id="quizBox">
<h1 id="welcome"></h1>
<p>Game Start! 🎉</p>
</div>
<script>
function enableSound(){
document.getElementById('enableBox').style.display='none';
document.getElementById('quizBox').style.display='block';
var n=document.getElementById('playerNameInput').value.trim();
if(n.length<2){n="BABUA";}
document.getElementById('welcome').innerText="Welcome "+n.toUpperCase()+" 👶";
}
</script>
</body>
</html>
