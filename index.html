<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zero Se Hero</title><style>:root{--bg:#0f0f12;--card:#1c1c21;--accent:#ffbd2e;--green:#2ecc71;--text:#f1f1f1}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:var(--bg);color:var(--text);padding-bottom:80px}header{padding:14px;background:#000;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0} .logo{font-weight:900;color:var(--accent)} .stat{background:var(--card);padding:6px 10px;border-radius:20px;font-size:13px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px} .card{background:var(--card);border-radius:16px;padding:14px;border:1px solid #2a2a30} .btn{width:100%;padding:12px;border:0;border-radius:12px;font-weight:800;margin-top:8px} .btn-y{background:var(--accent)} .btn-g{background:var(--green)} .tabs{position:fixed;bottom:0;left:0;right:0;background:#000;display:flex;padding:8px;gap:6px} .tab{flex:1;padding:10px;border-radius:10px;text-align:center;background:var(--card)} .tab.active{background:var(--accent);color:#000;font-weight:800} .slot{display:flex;justify-content:center;gap:8px;font-size:36px;margin:12px} .slot span{background:#000;padding:10px;border-radius:10px} .quiz-opt{width:100%;padding:10px;margin:6px 0;background:#2a2a35;border:0;border-radius:10px;color:#fff;text-align:left}</style></head><body><header><div class="logo">ZERO SE HERO</div><div style="display:flex;gap:8px"><div class="stat">💰 ₹<span id="money">500</span></div><div class="stat">⭐<span id="lvl">1</span></div></div></header><div style="padding:20px;text-align:center"><h1>Chai Wale Se Crorepati Tak</h1><p style="opacity:.6">500 brands, 100 Quiz, 10K Jackpot, Daily Stories</p></div><div id="p-trade"><div class="grid" id="brands"></div></div><div id="p-quiz" style="display:none;padding:12px"><div class="card"><h3 id="qtext"></h3><div id="qopts"></div></div></div><div id="p-slot" style="display:none;padding:12px"><div class="card" style="text-align:center"><h3>💸 GREEDY SLOT JACKPOT ₹10,000 💸</h3><div class="slot"><span id="s1">🍵</span><span id="s2">📦</span><span id="s3">💰</span></div><p style="font-size:12px">Cost ₹100 per spin</p><button class="btn btn-y" onclick="spin()">SPIN 🎰</button><p id="slotmsg"></p></div></div><div id="p-story" style="display:none;padding:12px"><div class="grid" id="stories"></div></div><div class="tabs"><div class="tab active" onclick="show('trade',this)">📈Trade</div><div class="tab" onclick="show('quiz',this)">🧠Quiz</div><div class="tab" onclick="show('slot',this)">🎰Slot</div><div class="tab" onclick="show('story',this)">📚Story</div></div><script>let money=parseInt(localStorage.getItem('m')||500),lvl=parseInt(localStorage.getItem('l')||1),un=parseInt(localStorage.getItem('u')||3);function save(){localStorage.setItem('m',money);localStorage.setItem('l',lvl);localStorage.setItem('u',un);moneyEl.innerText=money;lvlEl.innerText=lvl}const moneyEl=document.getElementById('money'),lvlEl=document.getElementById('lvl');const names=["Chai Point","Lijjat Papad","Balaji Wafers","Paper Boat","ID Fresh","Boat","Mamaearth","Sugar","Zouk","Bombay Shaving","Beardo","Bira","Naagin","Open Secret","Yoga Bar","Mithai Box","SareeKart","Khaadi","P-Tal","Channapatna Toys","Spice Route","Vada Pav Co","Samosa Singh","MBA Chai"];let brands=[];for(let i=0;i<500;i++){brands.push({n:names[i%names.length]+(i>25?' #'+(Math.floor(i/25)+1):''),p:50+Math.floor(Math.random()*950),g:(Math.random()*3-1).toFixed(1)})}function renderB(){let h='';brands.slice(0,30+un).forEach((b,i)=>{h+=`<div class=card><h3 style=font-size:13px>${b.n}</h3><div style=font-size:11px;opacity:.7>₹${b.p} • ${b.g}%/day</div><button class=btn btn-g onclick=buy(${i})>Buy ₹${b.p}</button></div>`});document.getElementById('brands').innerHTML=h}function buy(i){let b=brands[i];if(money>=b.p){money-=b.p;money+=Math.floor(b.p*1.6);lvl++;save();alert('Sold! +60% profit')}else alert('Paisa nahi! Quiz khelo')}const Q=[{q:"Lijjat Papad kisne start kiya?",o:["7 Gujarati Mahilayein","Tata","Ambani"],a:0},{q:"Boat company ka naam?",o:["Imagine Marketing","Ship Ltd","Audio"],a:0},{q:"Paper Boat famous?",o:["Aam Panna","Laptop","Shoes"],a:0},{q:"Zerodha founder?",o:["Nithin Kamath","Ratan Tata","Mallya"],a:0},{q:"Mamaearth kab bani?",o:["2016","1990","2023"],a:0}];for(let i=0;i<95;i++)Q.push({q:`${names[i%names.length]} ka margin?`,o:["10%","30-60%","200%"],a:1});let qi=0;function renderQ(){let q=Q[qi%Q.length];document.getElementById('qtext').innerText=`Q${qi+1}/100: ${q.q}`;let h='';q.o.forEach((o,i)=>h+=`<button class=quiz-opt onclick=ans(${i})>${o}</button>`);document.getElementById('qopts').innerHTML=h}function ans(i){let q=Q[qi%Q.length];if(i==q.a){money+=200;un++;lvl++;save();document.getElementById('qopts').innerHTML='<b style=color:#2ecc71>Sahi! +₹200</b>'}else document.getElementById('qopts').innerHTML='<b style=color:#ff4757>Galat!</b>';setTimeout(()=>{qi++;renderQ();},900)}function spin(){if(money<100){alert('₹100 chahiye');return}money-=100;save();let sym=["🍵","📦","💰","🚀","🧿","💎","🔥","👑"];let r=()=>sym[Math.floor(Math.random()*sym.length)];let a=r(),b=r(),c=r();s1.innerText=a;s2.innerText=b;s3.innerText=c;if(a==b&&b==c){money+=10000;save();slotmsg.innerText='🎉 JACKPOT ₹10,000!';}else if(a==b||b==c||a==c){money+=300;save();slotmsg.innerText='+₹300 jeeta!';}else slotmsg.innerText='Fir koshish kar!'}function renderS(){let list=["Chai wale ne ₹500 se 3 outlet banaye","Papad brand WhatsApp se ₹1L/month","Hostel me Boat jaisa earphone becha","Saree Reels se viral hui","Filter coffee Kirana tie-up","MBA Chai fail hoke crorepati","Kitchen me Epigamia jaisa dahi","Paper Boat copy juice","Mamaearth story se brand"];let h='';for(let i=0;i<un;i++)h+=`<div class=card><h3>Story #${i+1}</h3><p style=font-size:13px>${list[i%list.length]}</p></div>`;document.getElementById('stories').innerHTML=h}function show(t,el){document.getElementById('p-trade').style.display=t=='trade'?'block':'none';document.getElementById('p-quiz').style.display=t=='quiz'?'block':'none';document.getElementById('p-slot').style.display=t=='slot'?'block':'none';document.getElementById('p-story').style.display=t=='story'?'block':'none';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(t=='story')renderS()}renderB();renderQ();renderS();save();</script></body></html>
