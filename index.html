<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>150 NAME WALA</title><style>body{margin:0;background:#0a0a23;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}#enableBox{position:fixed;inset:0;background:#0a0a23;display:flex;justify-content:center;align-items:center;z-index:9999}#card{background:#1a1a4a;border:3px solid #ffeb3b;border-radius:20px;padding:24px;width:90%;max-width:360px;text-align:center}input{width:100%;padding:14px;border-radius:10px;border:0;text-align:center;font-size:18px;font-weight:700;margin:12px 0}.btn{background:#ffeb3b;color:#000;border:0;padding:14px;border-radius:12px;font-weight:900;width:100%}#quizBox{display:none;width:90%;max-width:400px;text-align:center}.q{background:#1a1a4a;padding:20px;border-radius:15px;border:2px solid #ffeb3b}.opt{background:#fff;color:#000;padding:12px;margin:8px 0;border-radius:10px}</style></head><body><div id="enableBox"><div id="card"><h2 style="color:#ffeb3b">150 UNIQUE<br>NAME WALA</h2><p>Certificate pe naam ayega</p><input id="playerNameInput" value="Hasmat"><button class="btn" onclick="go()">👶🥁 START</button></div></div><div id="quizBox"><h1 id="welcome"></h1><div class="q"><p id="qt"></p><div id="op"></div><p id="sc"></p></div></div><script>var PN="BABUA",QI=0,SC=0,QS=[{q:"2+2=?",o:["3","4","5"],a:1},{q:"India Capital?",o:["Mumbai","Delhi","Kolkata"],a:1},{q:"5*5=?",o:["20","25","30"],a:1}];function go(){document.getElementById("enableBox").style.display="none";document.getElementById("quizBox").style.display="block";var v=document.getElementById("playerNameInput").value.trim();if(v.length>=2){PN=v.toUpperCase();}document.getElementById("welcome").innerText="Welcome "+PN;showQ();}function showQ(){if(QI>=QS.length){document.getElementById("qt").innerText="Certificate Ready! "+PN;document.getElementById("op").innerHTML="<h2>Score:"+SC+"/"+QS.length+"</h2><p>Cert: "+PN+"</p>";return;}var q=QS[QI];document.getElementById("qt").innerText=(QI+1)+". "+q.q;var h="";for(var i=0;i<q.o.length;i++){h+='<div class="opt" onclick="ans('+i+')">'+q.o[i]+'</div>';}document.getElementById("op").innerHTML=h;document.getElementById("sc").innerText="Score:"+SC;}function ans(i){if(i==QS[QI].a){SC++;}QI++;showQ();}</script></body></html>
