<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINAL BOSS</title><style>body{margin:0;background:#0a0a2a;font-family:system-ui;color:#fff;text-align:center}.top{background:linear-gradient(90deg,#FF6B35,#FFB400);padding:10px;position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;font-weight:900}.card{background:#fff;color:#111;margin:10px;padding:12px;border-radius:14px;text-align:left}.vBox{background:linear-gradient(135deg,#1A237E,#311B92);color:#fff;padding:12px;border-radius:14px;text-align:center;border:3px solid gold}.btn{width:92%;padding:12px;border:0;border-radius:12px;font-weight:900;margin:6px 4%;background:gold}.hidden{display:none}.opt{width:92%;padding:9px;margin:4px 4%;border:2px solid #ddd;border-radius:10px;background:#fff;text-align:left;font-size:12px;color:#111}#cvs{width:280px;height:280px;display:block;margin:auto}.music{position:fixed;bottom:12px;right:12px;background:gold;border:3px solid #000;border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:99}</style><script src="brands.js"></script><script src="quiz.js"></script></head><body><div class="music" onclick="toggleBaba()" id="mu">🔇</div><div class="top"><span style="background:#fff;color:#FF6B35;padding:4px 8px;border-radius:15px">💰<span id="coins">1000</span></span><span style="background:#fff;color:#111;padding:4px 8px;border-radius:15px">📈<span id="total">1000</span></span><span style="background:gold;color:#111;padding:4px 8px;border-radius:15px">D<span id="day">1</span> Q<span id="qc">0</span>/5 S<span id="sl">3</span></span></div><div class="card"><div class="vBox"><div style="font-size:40px" id="vEmoji">🎙️</div><h3 id="vTitle" style="color:gold;margin:4px">VOICE ON KARO!</h3><p id="vText" style="font-size:12px">Natraj se Apple - Amitabh style!</p><button onclick="startVoiceStory()" id="playBtn" style="background:gold;color:#1A237E;padding:10px;border-radius:20px;font-weight:900;border:none;width:70%">▶️ VOICE START</button><button onclick="stopVoice()" style="background:#fff;color:#1A237E;padding:8px;border-radius:15px;border:none">⏹️</button><div style="background:rgba(0,0,0,.3);height:6px;border-radius:8px;margin-top:6px"><div id="vBar" style="height:100%;width:0%;background:gold"></div></div></div></div><div class="card"><h3>🛒 Bazaar</h3><div id="market"></div><button class="btn" onclick="startQuiz()">📚 QUIZ - 4 OPTION (3 funny 1 real)</button></div><div class="card hidden" id="quizCard"><h4 id="qq" style="color:#1A237E"></h4><div id="op"></div><p id="exp" style="color:green;font-weight:bold;font-size:12px"></p></div><div class="card hidden" id="spinCard" style="text-align:center"><h3>🎡 SPIN SIRF 3 BAAR!</h3><canvas id="cvs" width="280" height="280"></canvas><div id="win" style="font-size:40px;display:none"></div><h4 id="sr" style="color:red"></h4><button class="btn" id="sb" onclick="sp()">SPIN 🥁 (<span id="sleft">3</span> bache)</button><button class="btn" style="background:#a8e6cf" onclick="gl()">🏆 Leaderboard</button></div><div class="card hidden" id="lbCard"><div id="lb"></div><button class="btn" onclick="gc()">📜 Certificate</button></div><div class="card hidden" id="certCard" style="text-align:center"><h2>🌟 HERO CERTIFICATE 🌟</h2><img src="IMG_7295.jpg" onerror="this.src='IMG_7295.jpeg'" style="width:100px;border-radius:50%;border:3px solid gold"><h1 id="cn">HASMAT</h1><p>Coins <b id="cc"></b> Brands <b id="cb"></b></p><img src="IMG_7296.jpg" onerror="this.src='IMG_7296.jpeg'" style="width:100%;border-radius:10px"><button class="btn" onclick="speak('Shabash babua! Zero se hero ban gaya!')">🔊 SHABASH BABUA</button><button class="btn" onclick="location.reload()">🔄 FIR SE</button></div><script>var coins=1000,day=1,owned={},cur=0,playing=false,rate=0.8,act,babaOn=0,babaInt,spinUsed=0,qcNum=0,qTotal=5,sk=[],co=0;function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='hi-IN';u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}function d(f,du){try{if(!act)act=new(window.AudioContext||window.webkitAudioContext)();let o=act.createOscillator(),g=act.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0.8,act.currentTime);g.gain.exponentialRampToValueAtTime(0.01,act.currentTime+du);o.connect(g);g.connect(act.destination);o.start();o.stop(act.currentTime+du);}catch(e){}}function babaBeat(){d(120,0.35);setTimeout(()=>d(200,0.2),160);setTimeout(()=>d(90,0.4),420);}function toggleBaba(){if(babaOn){clearInterval(babaInt);babaOn=0;mu.innerText='🔇';}else{babaOn=1;mu.innerText='🎵';if(!act)act=new(window.AudioContext||window.webkitAudioContext)();babaBeat();babaInt=setInterval(babaBeat,900);}}function render(){coinsEl=coins;document.getElementById('coins').innerText=coins;var tot=coins;for(var k in owned)tot+=owned[k].qty*B[k].p;total.innerText=Math.floor(tot);dayEl=day;document.getElementById('day').innerText=day;var m="";B.forEach((b,i)=>{var can=coins>=b.p;var q=owned[i]?owned[i].qty:0;m+=`<div style="border:2px solid #eee;border-radius:8px;padding:6px;margin:4px 0;display:flex;justify-content:space-between"><div><b>${b.e} ${b.n}</b> ${q?`(${q}x)`:''}<br><small>₹${b.p}</small></div><div><button style="background:#1A237E;color:gold;border:none;padding:5px 7px;border-radius:12px" onclick="speakOne(${i})">🎙️</button><button style="background:#00C853;color:#fff;border:none;padding:5px 8px;border-radius:12px;margin-left:3px" ${can?'':'disabled'} onclick="buy(${i})">Buy</button></div></div>`});market.innerHTML=m;}function buy(i){if(coins<B[i].p)return;coins-=B[i].p;if(!owned[i])owned[i]={qty:0};owned[i].qty++;day++;co+=5;render();d(300,0.3);speak('Shabash babua! '+B[i].n+' kharid liya!');}function speakOne(i){cur=i;var b=B[i];vEmoji.innerText=b.e;vTitle.innerText=b.n;vText.innerText=b.s;vBar.style.width=((i+1)/B.length*100)+'%';try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(b.s);u.lang='hi-IN';u.rate=rate;u.pitch=0.55;speechSynthesis.speak(u);}catch(e){}}function startVoiceStory(){playing=true;cur=0;playBtn.innerText="⏸️ Pause";if(!babaOn)toggleBaba();function next(){if(!playing||cur>=B.length){playing=false;playBtn.innerText="🔁 Fir Se";vTitle.innerText="🎉 Khatam!";speak("Shabaash Babua! Zero se Hero ban gaye!");return;}speakOne(cur);cur++;setTimeout(next,7000);}next();}function stopVoice(){playing=false;speechSynthesis.cancel();playBtn.innerText="▶️ VOICE START";}function startQuiz(){quizCard.classList.remove('hidden');qcNum=0;sk=[];if(!babaOn)toggleBaba();nq();}function nq(){if(qcNum>=qTotal){quizCard.classList.add('hidden');spinCard.classList.remove('hidden');spinUsed=0;sl.innerText=3;sleft.innerText=3;sb.disabled=false;dr(0);speak("Quiz khatam! Ab spin!");return;}let i;do{i=Math.floor(Math.random()*QS.length)}while(sk.includes(i));sk.push(i);let q=QS[i];qc.innerText=qcNum;qq.innerText=(qcNum+1)+". "+q.q;op.innerHTML="";exp.innerText="";q.o.forEach((o,j)=>{let b=document.createElement('button');b.className="opt";b.innerText=(j+1)+". "+o;b.onclick=()=>{if(j==q.a){b.style.background="#55efc4";co+=10;coins+=10;exp.innerText="✅ Shabash! "+q.o[q.a];speak("Shabash babua! Sahi!");d(300,0.3);}else{b.style.background="#ff7675";exp.innerText="❌ Sahi: "+q.o[q.a];speak("Galat babua!");}render();setTimeout(()=>{qcNum++;nq()},1800)};op.appendChild(b)});}PR=[{l:"💰10",v:10,e:"💰",c:"#ffe66d"},{l:"🏆50",v:50,e:"🏆",c:"#ff6b6b"},{l:"💎20",v:20,e:"💎",c:"#48dbfb"},{l:"🎁5",v:5,e:"🎁",c:"#1dd1a1"},{l:"⭐15",v:15,e:"⭐",c:"#f368e0"},{l:"🔥100",v:100,e:"🔥",c:"#ff9f43"}];an=0;function dr(a){let cv=cvs.getContext('2d');cv.clearRect(0,0,280,280);PR.forEach((p,i)=>{let s=a+i*1.047,e=s+1.047;cv.beginPath();cv.moveTo(140,140);cv.arc(140,140,120,s,e);cv.closePath();cv.fillStyle=p.c;cv.fill();cv.stroke();cv.save();cv.translate(140,140);cv.rotate(s+0.52);cv.fillStyle="#000";cv.font="bold 12px sans-serif";cv.fillText(p.l,60,4);cv.restore()});cv.beginPath();cv.arc(140,140,8,0,6.28);cv.fillStyle="#fff";cv.fill();cv.stroke();}function sp(){if(spinUsed>=3){sr.innerText="⛔ 3 khatam!";sb.disabled=true;return;}d(150,0.5);sb.disabled=true;win.style.display="none";let stt=an,tar=an+Math.random()*10+15,s=null;function A(t){if(!s)s=t;let p=Math.min((t-s)/2500,1);an=stt+(tar-stt)*(1-Math.pow(1-p,3));dr(an);if(p<1)requestAnimationFrame(A);else{let idx=Math.floor((6-(an%(6.28))/1.047)%6);let pr=PR[idx];co+=pr.v;coins+=pr.v;spinUsed++;let left=3-spinUsed;sr.innerText="Jeeta "+pr.l+"! "+spinUsed+"/3";sl.innerText=left;sleft.innerText=left;win.innerHTML=pr.e+"<br><span style='font-size:14px'>"+pr.l+"</span>";win.style.display="block";render();d(300,0.4);speak("Shabash! "+pr.l+" jeeta!");if(spinUsed>=3){sb.disabled=true;sb.innerText="⛔ 3 KHATAM";sb.style.background="#ff7675";}else{sb.disabled=false;sb.innerText="SPIN 🥁 ("+left+" bache)";}}}requestAnimationFrame(A)}function gl(){spinCard.classList.add('hidden');lbCard.classList.remove('hidden');let L=JSON.parse(localStorage.getItem('lb')||"[]");L.push({n:"HASMAT",c:co});L.sort((a,b)=>b.c-a.c);L=L.slice(0,5);localStorage.setItem('lb',JSON.stringify(L));lb.innerHTML=L.map((r,i)=>"<div>"+(i+1)+". "+r.n+" - "+r.c+"</div>").join("");}function gc(){lbCard.classList.add('hidden');certCard.classList.remove('hidden');cn.innerText="HASMAT";cc.innerText=co;cb.innerText=Object.keys(owned).length;speak("Shabash babua! Zero se hero ban gaya!");}render();dr(0);</script></body></html>
