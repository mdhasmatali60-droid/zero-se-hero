<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>KIDS HERO HASMAT</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:linear-gradient(135deg,#ffecd2,#fcb69f);min-height:100vh;display:flex;justify-content:center;padding:12px}.app{width:100%;max-width:450px;background:#fff;border-radius:28px;padding:16px;border:4px solid #ffeaa7;box-shadow:0 15px 30px rgba(0,0,0,.15)}.top{display:flex;gap:8px;align-items:center;background:linear-gradient(90deg,#ffeaa7,#fab1a0);padding:10px;border-radius:16px}.logo{width:52px;height:52px;border-radius:12px;border:2px solid #fff;object-fit:cover}h1{font-size:20px;color:#d63031;font-weight:900}.stats{display:flex;gap:6px;margin:10px 0}.stat{flex:1;background:#fff;padding:6px;border-radius:12px;text-align:center;border:2px solid #ffeaa7}.stat b{display:block;color:#e17055}.card{background:#f8f9fa;padding:12px;border-radius:16px;margin:8px 0;border:2px solid #dfe6e9}.btn{width:100%;padding:12px;border:none;border-radius:14px;font-weight:900;margin:6px 0}.gold{background:linear-gradient(90deg,#fdcb6e,#e17055);color:#fff}.opt{background:#fff;text-align:left;border:2px solid #dfe6e9}.opt.correct{background:#55efc4!important}.opt.wrong{background:#ff7675!important;color:#fff}.progress{height:12px;background:#dfe6e9;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#ffe66d,#ff6b6b);width:0%;transition:.5s}.shabash{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99}.shabash.show{display:flex}.shabash-inner{background:#fff;padding:20px;border-radius:20px;text-align:center;border:4px solid #fdcb6e}.jackpot{position:fixed;inset:0;background:#ffeaa7;display:none;align-items:center;justify-content:center;z-index:100}.jackpot.show{display:flex}.hidden{display:none}input{width:100%;padding:10px;border-radius:12px;border:3px solid #ffeaa7;text-align:center;font-weight:800}#spinCanvas{width:100%;max-width:300px;display:block;margin:auto}.cert{background:#fffbe6;padding:16px;border-radius:18px;text-align:center;border:4px double #e17055}</style></head><body><div class="app"><div class="top"><img src="IMG_7295.jpeg" class="logo" onerror="this.src='https://i.imgur.com/8Km9tLL.png'"><img src="IMG_7296.jpeg" class="logo" onerror="this.src='https://i.imgur.com/Q6h0d5o.png'"><div><h1>👶 ZERO SE HERO KIDS</h1><div style="font-size:11px;font-weight:800">HASMAT KA PYARA GAME 😊</div></div></div><div class="stats"><div class="stat">💰<b id="coinBox">0</b></div><div class="stat">⭐<b id="levelBox">1</b></div><div class="stat">🏆<b id="scoreBoxTop">0</b></div></div><div id="startBox" class="card" style="text-align:center"><div style="font-size:50px">🧸🎈🍭</div><h2 style="color:#e17055">Chhota Hero!</h2><input id="playerName" value="HASMAT"><button class="btn gold" onclick="startGame()">🚀 CHALO KHELE 🥁</button><p style="font-size:11px">Volume ON rakho!</p></div><div id="quizBox" class="hidden"><div style="display:flex;justify-content:space-between;font-weight:900;font-size:12px"><span id="qCount"></span><span id="levelText"></span><span id="scoreBox"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="card"><h3 id="question"></h3></div><div id="options"></div></div><div id="levelUpBox" class="hidden"><div class="card" style="text-align:center;background:linear-gradient(135deg,#a8edea,#fed6e3)"><div style="font-size:50px">🎉🥁</div><h1 id="levelUpTitle">Level Complete!</h1><p>💰 <b id="levelCoins">0</b> coins</p><button class="btn gold" onclick="showSpin()">🎡 SPIN</button><button class="btn" style="background:#dfe6e9" onclick="showCert()">🏆 Certificate</button></div></div><div id="spinBox" class="hidden card" style="text-align:center"><h2>🎡 KISMAT CHAKKA</h2><canvas id="spinCanvas" width="300" height="300"></canvas><h2 id="spinResult" style="color:#e17055"></h2><button class="btn gold" onclick="spinWheel()">SPIN KARO</button><button class="btn" style="background:#dfe6e9" onclick="closeSpinAndNextLevel()">Aage ➡️</button></div><div id="certBox" class="hidden"><div class="cert" id="certEl"><div style="display:flex;justify-content:center;gap:10px"><img src="IMG_7295.jpeg" style="width:60px;height:60px;border-radius:50%;border:3px solid gold"><img src="IMG_7296.jpeg" style="width:60px;height:60px;border-radius:50%;border:3px solid gold"></div><h2>🌟 ZERO SE HERO 🌟</h2><h1 id="certName" style="color:#e17055">HASMAT</h1><p>Level: <b id="certLevel">1</b> | Coins: <b id="certCoins">0</b> | Score: <b id="certScore">0</b></p><p style="font-weight:900;margin-top:6px">👶 Shabash Babua! Superstar!</p><p id="certDate" style="font-size:10px"></p></div><button class="btn gold" onclick="playDhol();window.print()">🥁 Certificate</button><button class="btn" style="background:#fff;border:2px solid #ffeaa7" onclick="nextLevel()">Agla Level 🚀</button></div></div></div><div id="shabash" class="shabash"><div class="shabash-inner"><div style="font-size:60px">👶💛</div><div style="font-size:22px;font-weight:900;color:#e17055">Shabash Babua!</div><div>🌟 Sahi Jawab!</div><div id="shabashCoin">+10 Coins</div><div style="font-size:30px">🍫🎈</div></div></div><div id="jackpotBox" class="jackpot"><div style="text-align:center"><div style="font-size:80px">💰💎</div><h1 style="font-size:36px;color:#d63031">JACKPOT +100!</h1></div></div><audio id="dhol" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a650a6.mp3"></audio><script>
var QUESTIONS=[{q:"Chota Bheem ko kya pasand hai? 😋",o:["Laddoo","Pizza","Burger","Samosa"],a:0},{q:"Motu ka best friend kaun? 🤝",o:["Patlu","Ghasitaram","Dr.Jhatka","Chingum"],a:0},{q:"Billi kya bolti hai? 🐱",o:["Meow Meow","Bhow Bhow","Choo Choo","Oink Oink"],a:0},{q:"Hathi ki naak ko kya kehte? 🐘",o:["Soond","Poonch","Seeng","Kaana"],a:0},{q:"Ice-cream thandi ya garam? 🍦",o:["Thandi","Garam","Teekhi","Kadvi"],a:0},{q:"Superman udd sakta hai? 🦸",o:["Haan!","Nahi","Thoda","Raat ko"],a:0},{q:"Indradhanush me kitne rang? 🌈",o:["7","5","10","3"],a:0},{q:"A for? 🍎",o:["Apple","Ant","Aeroplane","Sab sahi!"],a:3},{q:"Machli kahan rehti? 🐟",o:["Paani me","Ped par","Ghar me","Hawa me"],a:0},{q:"Bandar ko kya pasand? 🐒",o:["Kela","Laptop","Jalebi","Chai"],a:0},{q:"Doraemon ke paas kya? 🤖",o:["Anywhere Door","Lathi","Cycle","Kite"],a:0},{q:"Gol kya hota? ⚽",o:["Ball","Book","Pen","Table"],a:0},{q:"Cycle me kitne pahiye? 🚲",o:["2","4","1","10"],a:0},{q:"Jungle ka raja? 👑",o:["Sher","Billi","Chooha","Kutta"],a:0},{q:"Teddy soft hota? 🧸",o:["Haan soft","Pathar jaisa","Kaante wala","Paani"],a:0},{q:"Suraj kab nikalta? ☀️",o:["Subah","Raat","Dopahar raat","Kabhi nahi"],a:0},{q:"Barish me kya girta? 🌧️",o:["Paani","Laddoo","Paise","Toffee"],a:0},{q:"1+1=? 🤔",o:["2","11","1","0"],a:0},{q:"Gaay kya deti? 🐄",o:["Doodh","Cola","Chips","KurKure"],a:0},{q:"5 ungli ek haath me? ✋",o:["5","10","2","8"],a:0},{q:"Penguin udd sakta? 🐧",o:["Nahi tairta hai!","Haan","Thoda","Sunday ko"],a:0},{q:"Tom and Jerry me billi? 🐱",o:["Tom","Jerry","Spike","Tyke"],a:0}];
var player="HASMAT",cur=0,score=0,coins=0,asked=[],TOTAL=10,level=1,dhol=document.getElementById('dhol');
function playDhol(){dhol.currentTime=0;dhol.play().catch(()=>{});}
function startGame(){player=document.getElementById('playerName').value||"HASMAT";document.getElementById('startBox').classList.add('hidden');document.getElementById('quizBox').classList.remove('hidden');playDhol();asked=[];cur=0;score=0;coins=0;level=1;upd();nextQ();}
function upd(){document.getElementById('coinBox').innerText=coins;document.getElementById('levelBox').innerText=level;document.getElementById('scoreBoxTop').innerText=score;document.getElementById('scoreBox').innerText="⭐"+score;document.getElementById('levelText').innerText="Level "+level;document.getElementById('qCount').innerText=(cur+1)+"/"+TOTAL;}
function nextQ(){if(cur>=TOTAL){showLevel();return}let idx;do{idx=Math.floor(Math.random()*QUESTIONS.length)}while(asked.includes(idx));asked.push(idx);let q=QUESTIONS[idx];document.getElementById('question').innerText=q.q;upd();document.getElementById('bar').style.width=(cur/TOTAL*100)+"%";let oDiv=document.getElementById('options');oDiv.innerHTML="";q.o.forEach((op,i)=>{let b=document.createElement('button');b.className="btn opt";b.innerText=String.fromCharCode(65+i)+". "+op;b.onclick=()=>chk(i,q.a,b);oDiv.appendChild(b)})}
function chk(sel,ans,btn){let bs=document.querySelectorAll('.opt');bs.forEach(x=>x.disabled=true);if(sel==ans){btn.classList.add('correct');score++;coins+=10;if(Math.random()<0.15){coins+=100;showJP();}try{let u=new SpeechSynthesisUtterance("Shabash Babua");u.lang="hi-IN";u.rate=1.1;speechSynthesis.speak(u);}catch(e){}showSh();}else{btn.classList.add('wrong');bs[ans].classList.add('correct');try{let u=new SpeechSynthesisUtterance("Koi baat nahi babu");u.lang="hi-IN";speechSynthesis.speak(u);}catch(e){}}upd();setTimeout(()=>{cur++;nextQ();},1200);}
function showSh(){document.getElementById('shabashCoin').innerText="+"+10+" Coins = "+coins;let s=document.getElementById('shabash');s.classList.add('show');playDhol();setTimeout(()=>s.classList.remove('show'),1300);}
function showJP(){let j=document.getElementById('jackpotBox');j.classList.add('show');playDhol();setTimeout(()=>j.classList.remove('show'),1800);}
function showLevel(){document.getElementById('quizBox').classList.add('hidden');document.getElementById('levelUpBox').classList.remove('hidden');document.getElementById('levelCoins').innerText=coins;playDhol();}
function showSpin(){document.getElementById('levelUpBox').classList.add('hidden');document.getElementById('spinBox').classList.remove('hidden');drawW();}
function closeSpinAndNextLevel(){document.getElementById('spinBox').classList.add('hidden');showCert();}
function showCert(){document.getElementById('spinBox').classList.add('hidden');document.getElementById('levelUpBox').classList.add('hidden');document.getElementById('quizBox').classList.add('hidden');document.getElementById('certBox').classList.remove('hidden');document.getElementById('certName').innerText=player;document.getElementById('certLevel').innerText=level;document.getElementById('certCoins').innerText=coins;document.getElementById('certScore').innerText=score;document.getElementById('certDate').innerText=new Date().toLocaleDateString('hi-IN');playDhol();}
function nextLevel(){level++;cur=0;asked=[];document.getElementById('certBox').classList.add('hidden');document.getElementById('quizBox').classList.remove('hidden');upd();nextQ();}
var ang=0,prizes=["20 Coins","Chocolate","Gift","50 Jackpot!","Lollipop","15 Coins","Ice Cream","+5 Bonus"];function drawW(){let c=document.getElementById('spinCanvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,300,300);for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(150,150);ctx.arc(150,150,130,ang+i*Math.PI/4,ang+(i+1)*Math.PI/4);ctx.closePath();ctx.fillStyle=['#ffe66d','#ff6b6b','#48dbfb','#1dd1a1','#f368e0','#ff9f43','#00d2d3','#fab1a0'][i];ctx.fill();ctx.stroke();ctx.save();ctx.translate(150,150);ctx.rotate(ang+i*Math.PI/4+Math.PI/8);ctx.fillStyle="#000";ctx.font="900 11px sans-serif";ctx.fillText(prizes[i],35,4);ctx.restore()}}
function spinWheel(){let iv=setInterval(()=>{ang+=0.3;drawW();},20);setTimeout(()=>{clearInterval(iv);let add=Math.floor(Math.random()*25)+5;coins+=add;document.getElementById('spinResult').innerText="Jeeta "+add+" Coins! 🎉";document.getElementById('coinBox').innerText=coins;playDhol();},2000);}drawW();
</script></body></html>
