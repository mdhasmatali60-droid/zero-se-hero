<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Zero Se Hero FINAL</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:linear-gradient(180deg,#0a0a1f,#1a1040,#0f1a3a);color:#fff}.app{max-width:430px;margin:0 auto;background:rgba(0,0,0,.3);min-height:100vh}.cover{width:100%;height:220px;object-fit:cover}.logo{width:100px;height:100px;border-radius:50%;border:4px solid gold;margin:-50px auto 10px;display:block;object-fit:cover;background:#111}.card{margin:12px;background:#ffffff0d;border-radius:18px;padding:15px}.opt{width:100%;padding:12px;margin:5px 0;border-radius:12px;background:#ffffff14;border:1px solid #ffffff1a;color:#fff;text-align:left;cursor:pointer}.opt.ok{background:#00c853!important}.opt.no{background:#d50000!important}.bar{height:7px;background:#ffffff1a;border-radius:10px;overflow:hidden}.bar div{height:100%;background:gold;width:0%;transition:.6s}.btn{width:100%;padding:14px;border-radius:13px;border:none;background:linear-gradient(90deg,gold,orange);font-weight:800;margin-top:12px}</style></head><body><div class="app">
<img class="cover" src="IMG_7295.jpeg">
<img class="logo" src="IMG_7296.jpeg">
<h1 style="text-align:center;color:gold">ZERO to HERO</h1><p style="text-align:center;opacity:.7;font-size:10px">FINAL 150 • PHOTO DONE ✅</p>
<div class="card" id="c"><div class="bar"><div id="bar"></div></div><div style="display:flex;justify-content:space-between;font-size:11px;margin:10px 0"><span id="qno">1/20</span><span id="sc">Score:0</span><span id="st">🔥0</span></div><div id="qt" style="font-weight:700;min-height:50px"></div><div id="opts"></div><div id="fmsg" style="text-align:center;font-size:11px;margin-top:10px;min-height:20px"></div></div></div>
<script>
const Q=[{q:"Nataraj Pencil kaise No.1 bana? ✏️",a:["Sasti+quality se","Mehenga","Jadu"],c:0,f:"Zero se Hero!"},{q:"Nirma cycle se kaise bada? 🚲",a:["Ghar se cycle pe","Paisa","Jadu"],c:0,f:"Cycle se crore!"},{q:"Parle-G sasta kyu? 🍪",a:["Har gareeb ka biscuit","Mehenga","Jhooth"],c:0,f:"Desh ka biscuit!"},{q:"Haldiram kaise bada? 🥨",a:["Bikaner dukan se duniya","Ek din","Jadu"],c:0,f:"Bhujia se duniya!"},{q:"Amul kaise bana? 🥛",a:["Kisan ne milke","Ek aadmi","Sarkar"],c:0,f:"Kisan brand!"},{q:"MDH Dadaji? 👴",a:["Tanga chalake","Paisa","Lottery"],c:0,f:"Tanga se King!"},{q:"Lijjat Papad? 👩",a:["7 aurat 80rs se crore","Paisa","Company"],c:0,f:"Auraton ki takat!"},{q:"Infosys 10k se? 💻",a:["7 dost 10k se","Paisa","Sarkar"],c:0,f:"Dosti+Mehnat!"},{q:"Brand formula? 🔥",a:["Sasta+Achha+Har jagah=Hero","Mehenga","Kuch nahi"],c:0,f:"Formula lock!"},{q:"Trading pehle kya? ✏️",a:["Pura paisa","Sikho+chhota","Udhaar"],c:1,f:"Pehle seekh!"},{q:"Hara candle?",a:["Loss","Profit Party 🟢","Band"],c:1,f:"Hara=Party!"},{q:"Lal candle?",a:["Nacho","Sambhal jao 🔴","Ro"],c:1,f:"Lal=Danger!"},{q:"Pencil use? ✏️",a:["Graph banao","Khana","Kuch nahi"],c:0,f:"Graph=Hero!"},{q:"Risk?",a:["Sab ek jagah","Divide karo 👑","Lo hi mat"],c:1,f:"Divide!"},{q:"Loss pe?",a:["Ro","Haso seekho","Tode"],c:1,f:"Haso jeeto!"},{q:"Bull? 🐂",a:["Up","Down","So"],c:0,f:"Bull=Up!"},{q:"Bear? 🐻",a:["Down","Up","Nach"],c:0,f:"Bear=Down!"},{q:"10rs pencil 20rs profit?",a:["0","10rs=100%","5rs"],c:1,f:"100%!"},{q:"Zero se Hero? 🏆",a:["0+Mehnat×Maths=Hero 🔥","0+0=0","Kismat"],c:0,f:"SHABASH KING!"}];
let idx=0,sc=0,st=0,TOTAL=Q.length;
function load(){if(idx>=TOTAL){document.getElementById('qt').innerHTML="🏆 DONE! Score "+sc+"/190<br>Shabash Babua! Photo lag gayi! 🔥";return}let cur=Q[idx];document.getElementById('qt').textContent=(idx+1)+". "+cur.q;document.getElementById('qno').textContent=(idx+1)+"/"+TOTAL;document.getElementById('bar').style.width=(idx/TOTAL*100)+"%";let o=document.getElementById('opts');o.innerHTML="";cur.a.forEach((t,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{document.querySelectorAll('.opt').forEach(x=>x.onclick=null);if(j==cur.c){b.classList.add('ok');sc+=10;st++;document.getElementById('fmsg').textContent="✅ "+cur.f}else{b.classList.add('no');o.children[cur.c].classList.add('ok');st=0;document.getElementById('fmsg').textContent="❌ "+cur.f}document.getElementById('sc').textContent="Score:"+sc;document.getElementById('st').textContent="🔥"+st;setTimeout(()=>{idx++;document.getElementById('fmsg').textContent="";load()},1000)};o.appendChild(b)})}
load();
</script></body></html>
