<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HASMAT FINAL</title><style>body{margin:0;background:#ffecd2;font-family:system-ui;display:flex;justify-content:center;padding:10px}.app{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:12px;border:3px solid gold}.btn{width:100%;padding:12px;border:0;border-radius:12px;font-weight:900;margin:6px 0;background:linear-gradient(90deg,#fdcb6e,#e17055);color:#fff}.opt{width:100%;padding:10px;margin:4px 0;border:2px solid #ddd;border-radius:10px;text-align:left;background:#fff}.hidden{display:none}.bar{height:10px;background:#ffe66d;width:0%;transition:.3s} #spinCanvas{width:260px;height:260px;display:block;margin:auto}</style></head><body><div class="app">
<h2 style="text-align:center">👶 ZERO SE HERO - HASMAT 🥁</h2>
<div>💰<b id="c">0</b> | ⭐Lv<b id="lv">1</b> | Score<b id="sc">0</b></div>
<div id="s1" style="text-align:center"><input id="nm" value="HASMAT" style="width:90%;padding:8px;border-radius:8px;border:2px solid gold;text-align:center"><button class="btn" onclick="start()">🚀 START - DHOL ON 🥁</button><p style="font-size:11px">START pe tap karte hi DHOL bajega! Vol ON rakho</p></div>
<div id="s2" class="hidden"><div style="font-size:11px"><span id="qc"></span> | Lv<span id="lvt"></span></div><div style="background:#eee;border-radius:10px"><div id="bar" class="bar"></div></div><h3 id="q"></h3><div id="opts"></div></div>
<div id="s3" class="hidden" style="text-align:center"><h2 id="lt"></h2><p>Bonus +20 coins!</p><p>Total: <b id="lc"></b></p><button class="btn" onclick="goSpin()">🎡 3 SPIN LO 🥁</button></div>
<div id="s4" class="hidden" style="text-align:center"><h3>🎡 SPIN - <span id="sl">3</span> left</h3><canvas id="spinCanvas" width="260" height="260"></canvas><h3 id="sr" style="color:red"></h3><button class="btn" id="spb" onclick="doSpin()">🥁 SPIN KARO DHOL KE SAATH</button><button class="btn" style="background:#eee;color:#000" onclick="goLead()">Leaderboard dekho ➡️</button></div>
<div id="s5" class="hidden"><h3 style="text-align:center">🏆 TOP 5 LEADERBOARD</h3><div id="lb"></div><p>Total Coins: <b id="fc"></b></p><button class="btn" onclick="goCert()">🏆 Certificate Lo</button></div>
<div id="s6" class="hidden" style="text-align:center"><div style="background:#fffbe6;padding:12px;border-radius:14px;border:3px double gold"><h2>🌟 CERTIFICATE 🌟</h2><h1 id="cn" style="color:red">HASMAT</h1><p>Level <b id="clv"></b> | Coins <b id="cc"></b> | Score <b id="csc"></b></p><p>👶 Shabash Babua! Superstar!</p><p id="dt" style="font-size:10px"></p><img src="IMG_7295.jpeg" style="width:50px;height:50px;border-radius:50%;border:2px solid gold"><img src="IMG_7296.jpeg" style="width:50px;height:50px;border-radius:50%;border:2px solid gold"></div><button class="btn" onclick="nextLv()">🚀 NEXT LEVEL + BONUS</button></div>
</div>
<audio id="aud" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_2a795d1bd9.mp3?filename=indian-dhol-110481.mp3"></audio>
<script>
var QS=[{q:"Bheem ko kya pasand?",o:["Laddoo","Pizza","Burger","Samosa"],a:0},{q:"Billi kya bolti?",o:["Meow","Bhow","Choo","Oink"],a:0},{q:"Ice-cream kaisi?",o:["Thandi","Garam","Teekhi","Kadvi"],a:0},{q:"1+1?",o:["2","11","1","0"],a:0},{q:"Cycle me pahiye?",o:["2","4","1","10"],a:0},{q:"Jungle ka raja?",o:["Sher","Billi","Chooha","Kutta"],a:0},{q:"A for?",o:["Apple","Ant","Plane","Sab sahi"],a:3},{q:"Machli kahan?",o:["Paani","Ped","Ghar","Hawa"],a:0},{q:"Bandar ko?",o:["Kela","Laptop","Jalebi","Chai"],a:0},{q:"Gaay deti?",o:["Doodh","Cola","Chips","Kurkure"],a:0},{q:"Tom me billi?",o:["Tom","Jerry","Spike","Tyke"],a:0},{q:"Hathi ki naak?",o:["Soond","Poonch","Seeng","Kaana"],a:0}];
var cur=0,score=0,coins=0,asked=[],TOTAL=10,level=1,spin=3,pl="HASMAT",aud=document.getElementById('aud');
function dhol(){aud.currentTime=0;aud.play().catch(()=>{let ctx=new(window.AudioContext||window.webkitAudioContext)();let o=ctx.createOscillator();o.frequency.value=150;o.connect(ctx.destination);o.start();setTimeout(()=>o.stop(),300);});}
function start(){pl=document.getElementById('nm').value||"HASMAT";dhol();document.getElementById('s1').classList.add('hidden');document.getElementById('s2').classList.remove('hidden');cur=0;score=0;coins=0;level=1;asked=[];upd();nextQ();}
function upd(){document.getElementById('c').innerText=coins;document.getElementById('lv').innerText=level;document.getElementById('sc').innerText=score;document.getElementById('lvt').innerText=level;document.getElementById('qc').innerText=(cur+1)+"/"+TOTAL;}
function nextQ(){if(cur>=TOTAL){showLvl();return}let i;do{i=Math.floor(Math.random()*QS.length)}while(asked.includes(i));asked.push(i);let q=QS[i];document.getElementById('q').innerText=q.q;document.getElementById('bar').style.width=(cur/TOTAL*100)+"%";upd();let d=document.getElementById('opts');d.innerHTML="";q.o.forEach((o,j)=>{let b=document.createElement('button');b.className="opt";b.innerText=o;b.onclick=()=>chk(j,q.a,b);d.appendChild(b)})}
function chk(s,a,b){let bs=document.querySelectorAll('.opt');bs.forEach(x=>x.disabled=true);if(s==a){b.style.background="#55efc4";score++;coins+=10;dhol();}else{b.style.background="#ff7675";bs[a].style.background="#55efc4";}upd();setTimeout(()=>{cur++;nextQ();},900);}
function showLvl(){document.getElementById('s2').classList.add('hidden');document.getElementById('s3').classList.remove('hidden');coins+=20;document.getElementById('lt').innerText="Level "+level+" Complete! 🎉";document.getElementById('lc').innerText=coins;dhol();}
function goSpin(){document.getElementById('s3').classList.add('hidden');document.getElementById('s4').classList.remove('hidden');spin=3;document.getElementById('sl').innerText=spin;draw(0);}
function goLead(){document.getElementById('s4').classList.add('hidden');document.getElementById('s5').classList.remove('hidden');document.getElementById('fc').innerText=coins;let L=JSON.parse(localStorage.getItem('lb2')||"[]");L.push({n:pl,c:coins,lv:level});L.sort((x,y)=>y.c-x.c);L=L.slice(0,5);localStorage.setItem('lb2',JSON.stringify(L));let h="<table style='width:100%'><tr><th>#</th><th>Name</th><th>Coins</th></tr>";L.forEach((r,i)=>{h+="<tr><td>"+(i+1)+"</td><td>"+r.n+"</td><td>"+r.c+"</td></tr>"});h+="</table>";document.getElementById('lb').innerHTML=h;}
function goCert(){document.getElementById('s5').classList.add('hidden');document.getElementById('s6').classList.remove('hidden');document.getElementById('cn').innerText=pl;document.getElementById('clv').innerText=level;document.getElementById('cc').innerText=coins;document.getElementById('csc').innerText=score;document.getElementById('dt').innerText=new Date().toLocaleDateString();dhol();}
function nextLv(){level++;cur=0;asked=[];document.getElementById('s6').classList.add('hidden');document.getElementById('s2').classList.remove('hidden');upd();nextQ();dhol();}
var ang=0;function draw(a){ang=a;let c=document.getElementById('spinCanvas'),x=c.getContext('2d');x.clearRect(0,0,260,260);for(let i=0;i<8;i++){x.beginPath();x.moveTo(130,130);x.arc(130,130,110,ang+i*0.785,ang+(i+1)*0.785);x.closePath();x.fillStyle=["#ffe66d","#ff6b6b","#48dbfb","#1dd1a1","#f368e0","#ff9f43","#00d2d3","#fab1a0"][i];x.fill();x.stroke();x.save();x.translate(130,130);x.rotate(ang+i*0.785+0.39);x.fillStyle="#000";x.font="bold 11px sans-serif";x.fillText(["20 Coins","10 Choc","10 Gift","50 Jackpot","5 Lolly","15 Coins","10 Ice","5 Bonus"][i],30,4);x.restore();}}
function doSpin(){if(spin<=0)return;dhol();let b=document.getElementById('spb');b.disabled=true;let start=ang,tar=ang+Math.random()*10+10,s=null;function anim(t){if(!s)s=t;let p=Math.min((t-s)/2000,1);ang=start+(tar-start)*(1-Math.pow(1-p,3));draw(ang);if(p<1)requestAnimationFrame(anim);else{let add=[20,10,10,50,5,15,10,5][Math.floor(Math.random()*8)];coins+=add;spin--;document.getElementById('sr').innerText="Jeeta "+add+" Coins! "+spin+" bache";document.getElementById('c').innerText=coins;document.getElementById('sl').innerText=spin;dhol();b.disabled=false;}}requestAnimationFrame(anim);}draw(0);
</script></body></html>
