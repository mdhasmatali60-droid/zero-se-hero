<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HASMAT</title><style>body{margin:0;background:#ffecd2;font-family:system-ui;display:flex;justify-content:center;padding:10px}.app{max-width:420px;width:100%;background:#fff;border-radius:20px;padding:12px;border:3px solid gold}.btn{width:100%;padding:12px;border:0;border-radius:12px;font-weight:900;margin:6px 0;background:#fdcb6e}.hidden{display:none}.opt{width:100%;padding:10px;margin:4px 0;border:2px solid #ddd;border-radius:10px;background:#fff;text-align:left}#cvs{width:260px;height:260px;display:block;margin:auto}</style></head><body><div class="app"><h2 style="text-align:center">ZERO SE HERO 🥁 HASMAT</h2><div>💰<b id="co">0</b> | Lv<b id="lv">1</b></div><div id="p1" style="text-align:center"><input id="nm" value="HASMAT" style="width:90%;padding:8px;border:2px solid gold;border-radius:8px;text-align:center"><button class="btn" onclick="st()">🚀 START + DHOL</button></div><div id="p2" class="hidden"><h3 id="qq"></h3><div id="op"></div></div><div id="p3" class="hidden" style="text-align:center"><h2 id="lt"></h2><p>Total <b id="lc"></b></p><button class="btn" onclick="gs()">🎡 3 SPIN LO</button></div><div id="p4" class="hidden" style="text-align:center"><h3>SPIN <span id="sl">3</span></h3><canvas id="cvs" width="260" height="260"></canvas><h3 id="sr" style="color:red"></h3><button class="btn" id="sb" onclick="sp()">SPIN KARO 🥁</button><button class="btn" style="background:#eee" onclick="gl()">🏆 Leaderboard</button></div><div id="p5" class="hidden"><h3>🏆 TOP 5</h3><div id="lb"></div><button class="btn" onclick="gc()">📜 Certificate</button></div><div id="p6" class="hidden" style="text-align:center"><h2>🌟 CERTIFICATE 🌟</h2><h1 id="cn" style="color:red"></h1><p>Lv<b id="cl"></b> Coins<b id="cc"></b></p><p>👶 Shabash Babua!</p><button class="btn" onclick="location.reload()">NEXT LEVEL</button></div></div><audio id="au" src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_2a795d1bd9.mp3?filename=indian-dhol-110481.mp3"></audio><script>QS=[{q:"Bheem ko kya pasand?",o:["Laddoo","Pizza"],a:0},{q:"Billi kya bolti?",o:["Meow","Bhow"],a:0},{q:"1+1=?",o:["2","11"],a:0},{q:"Sher kaun?",o:["Sher","Billi"],a:0},{q:"Cycle tyre?",o:["2","4"],a:0}];c=0;co=0;sk=[];T=3;lv=1;spn=3;au=document.getElementById('au');function d(){au.currentTime=0;au.play().catch(()=>{});}function st(){d();p1.classList.add('hidden');p2.classList.remove('hidden');c=0;co=0;sk=[];up();nq();}function up(){coEl=document.getElementById('co');coEl.innerText=co;lvEl=document.getElementById('lv');lvEl.innerText=lv;}function nq(){if(c>=T){p2.classList.add('hidden');p3.classList.remove('hidden');co+=20;lt.innerText="Level "+lv+" Done!";lc.innerText=co;d();return;}let i;do{i=Math.floor(Math.random()*QS.length)}while(sk.includes(i));sk.push(i);let q=QS[i];qq.innerText=q.q;op.innerHTML="";q.o.forEach((o,j)=>{let b=document.createElement('button');b.className="opt";b.innerText=o;b.onclick=()=>{if(j==q.a){b.style.background="#55efc4";co+=10;d();}else b.style.background="#ff7675";up();setTimeout(()=>{c++;nq();},600)};op.appendChild(b);});}function gs(){p3.classList.add('hidden');p4.classList.remove('hidden');spn=3;sl.innerText=spn;dr(0);}function gl(){p4.classList.add('hidden');p5.classList.remove('hidden');let L=JSON.parse(localStorage.getItem('lb')||"[]");L.push({n:nm.value,c:co});L.sort((a,b)=>b.c-a.c);L=L.slice(0,5);localStorage.setItem('lb',JSON.stringify(L));lb.innerHTML=L.map((r,i)=>"<div>"+(i+1)+". "+r.n+" - "+r.c+"</div>").join("");}function gc(){p5.classList.add('hidden');p6.classList.remove('hidden');cn.innerText=nm.value;cl.innerText=lv;cc.innerText=co;d();}an=0;function dr(a){an=a;let cv=cvs.getContext('2d');cv.clearRect(0,0,260,260);for(let i=0;i<6;i++){cv.beginPath();cv.moveTo(130,130);cv.arc(130,130,110,an+i*1.04,an+(i+1)*1.04);cv.closePath();cv.fillStyle=["#ffe66d","#ff6b6b","#48dbfb","#1dd1a1","#f368e0","#ff9f43"][i];cv.fill();cv.stroke();}}function sp(){if(spn<=0)return;d();sb.disabled=true;let stt=an,tar=an+Math.random()*10+10,s=null;function A(t){if(!s)s=t;let p=Math.min((t-s)/2000,1);an=stt+(tar-stt)*(1-Math.pow(1-p,3));dr(an);if(p<1)requestAnimationFrame(A);else{let ad=[20,10,50,5,15,10][Math.floor(Math.random()*6)];co+=ad;spn--;sr.innerText="Jeeta "+ad+" Coins "+spn+" bache";up();sl.innerText=spn;d();sb.disabled=false;}}requestAnimationFrame(A);}dr(0);</script></body></html>
