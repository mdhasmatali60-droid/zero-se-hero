<style>

</style></head><body>
<div id="enableBox"><div class="enableCard"><div style="font-size:52px">🔊🎵</div><h2 style="color:gold;margin:8px 0">Sound ON karo!</h2><p style="font-size:12px;opacity:.8;margin-bottom:12px">iPhone pe music ke liye ek baar tap zaruri hai!</p><button class="btnGold" onclick="enableSound()">🔊 SOUND ON + START HERO JOURNEY 🚀</button></div></div>
<div class="app">

<div class="card"><div class="bar"><div id="bar"></div></div>

<div id="certModal"><div class="certBox"><div class="certHeader"><img src="IMG_7296.jpeg?v=PHOTO150" alt="L"><h3>⭐ ZERO SE HERO ⭐</h3><img src="IMG_7295.jpeg?v=PHOTO150" alt="R" style="border-radius:8px"></div>
<div class="certBody"><div style="font-size:44px">🏆</div><h2 style="color:#d63031;font-size:18px">HERO CERTIFICATE</h2><div class="cName">BABUA HERO</div><p>Ne <b id="cQuiz">10</b> Quiz Complete Kiye!</p><div style="font-size:19px;font-weight:900;color:#00b894" id="cScore"></div><div class="shayari" id="shayari"></div><button class="btnGold" onclick="document.getElementById('certModal').style.display='none'">🚀 Aage Badho Hero!</button></div></div></div>
<button class="musicBtn" id="mBtn" onclick="toggleMusic()">🔊</button>
<script>
var Q=[
["Nataraj pencil No.1 kaise bana?","Sasti+Har jagah available","Mehenga bechke","Jadu se",0,"Sasti cheez sabke paas pahuchti hai!"],
["Nirma cycle se kaise crore ka bana?","Cycle pe ghar-ghar bechke","Paisa tha","Jadu se",0,"Cycle se empire khada kiya!"],
["Parle-G desh ka biscuit kyu?","Sasta+Swad+Har jagah","Mehenga","Ads se",0,"Desh ka biscuit!"],
["Haldiram Bikaner se duniya kaise?","Bhujia ki quality se","Ek din me","Paisa se",0,"Quality se duniya jeeti!"],
["Amul kaise bana?","Kisan ek saath aaye","Ek aadmi ne","Sarkar ne",0,"Kisan ki takat se brand!"],
["MDH wale Dadaji kaise bane?","Tanga chalake masala bechke","Paisa tha","Lottery se",0,"Mehnat se King bane!"],
["Lijjat papad kaise crore ka bana?","7 aurat 80rs se start","Factory se","Paisa se",0,"Auraton ki takat!"],
["Infosys 10k se kaise bana?","7 dost 10k se start","Paisa bahut tha","Sarkar se",0,"Dosti+Mehnat se empire!"],
["Trading me pehle kya karna chahiye?","Pura paisa laga do","Sikho+Demo+Chhota start karo","Udhaar lo",1,"Pehle seekh, phir kama!"],
["Hara candle ka matlab kya?","Loss","Buyers jeete/Profit Party","Market band",1,"Hara = Buyers ki Party!"]
];
var extra=[
["Nike kaise bada brand bana zero se?","Mehnat+Quality+Har jagah available","Ek din me","Jadu se",0,"Mehnat se brand banta hai!"],
["Support kya hota hai trading me?","Neeche ka sahara jahan kharidte hain","Upar ka level","Kuch nahi hota",0,"Support pe kharid, Resistance pe bech!"],
["Stop loss kyu zaruri hai?","Bada loss rokne ke liye","Profit ke liye","Timepass ke liye",0,"Stop loss = Jaan bachao!"],
["Overtrading kya karta hai?","Paisa dubata hai","Paisa badhata hai","Kuch nahi karta",0,"Kam trade = Bada paisa!"],
["Consistency kyu zaruri hai hero banne?","Roz mehnat se hero bante hain","Ek din me","Soke rehne se",0,"Roz ka kaam hero banata hai!"]
];
for(var i=11;i<=150;i++){var e=extra[(i-11)%extra.length];Q.push(["Q"+i+" "+e[0],e[1],e[2],e[3],e[4],e[5]]);}
var SHAYARI=["Rukna nahi jhukna nahi,\n10 kiye 140 baki hai! 🔥","Cycle se shuru hua Nirma,\nTune quiz se kiya shuru! 🚲","20 ho gaye mere sher,\nAb tu hero ban raha hai! 💪","40 ho gaye, aadat si hai,\nAb rukna nahi! 🦁","50 HALF CENTURY!\nAadhi jung jeet li! 🏏","60 - Tu tohfa hai,\nSeekhna jaari rakkh! 📚","70 - Rocket hai tu,\nAasman chhune wala! 🚀","80 - Wah Babua Wah!\nKya baat hai! 👏","90 - Manzil saamne hai,\nBas 60 baki! 🎯","100 CENTURY! 🏆💯\nTu Legend hai!","110 - Legend hai tu,\nAb koi nahi rok sakta! 👑","120 - Super Hero ban gaya!\nPower aa gayi! ⚡","130 - Ultra Hero!\nAb tohfa hai tu! 🌟","140 - Final ke kareeb,\nBas 10 baki! 🎯","150 - ZERO SE HERO BAN GAYA BABUA! 👑🔥\nTu King hai!"];
var total=150,idx=0,sc=0,st=0,musicOn=false,audioCtx=null,curCorrect=0;
function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx;}
function beep(f,d,t){try{var c=getCtx(),o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.6,c.currentTime);o.start();g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+d);setTimeout(function(){o.stop()},d*1000);}catch(e){}}
function playCorrect(){beep(800,0.2);setTimeout(function(){beep(1200,0.35)},160);}
function playWrong(){beep(180,0.55,'sawtooth');}
function playCert(){beep(400,0.22);setTimeout(function(){beep(600,0.22)},220);setTimeout(function(){beep(900,0.65)},450);}
function enableSound(){musicOn=true;getCtx();beep(600,0.2);setTimeout(function(){beep(900,0.3)},200);document.getElementById('enableBox').style.display='none';document.getElementById('mBtn').innerText='🔊';}
function toggleMusic(){if(!musicOn){enableSound();return;}musicOn=!musicOn;document.getElementById('mBtn').innerText=musicOn?'🔊':'🔇';if(musicOn)beep(600,0.2);}
function showCert(){document.getElementById('cQuiz').innerText=idx;document.getElementById('cScore').innerText='Score: '+sc+' | Streak: 🔥'+st;var si=Math.floor(idx/10)-1;if(si<0)si=0;if(si>=SHAYARI.length)si=SHAYARI.length-1;document.getElementById('shayari').innerText=SHAYARI[si];document.getElementById('certModal').style.display='flex';if(musicOn)playCert();if(navigator.vibrate)navigator.vibrate([200,100,200]);}
function load(){if(idx>=total){document.getElementById('qt').innerHTML='🏆 150 DONE! TU KING HAI BABUA! 👑🔥<br><br>Ab tu Zero se Hero ban gaya!';document.getElementById('opts').innerHTML='';return;}var cur=Q[idx];curCorrect=cur[4];document.getElementById('qt').innerText=(idx+1)+'. '+cur[0];document.getElementById('qno').innerText=(idx+1)+'/150';document.getElementById('sc').innerText='Score: '+sc;document.getElementById('st').innerText='🔥 '+st;document.getElementById('bar').style.width=(idx/total*100)+'%';document.getElementById('s1').innerText='SLOT '+(Math.floor(idx/10)+1);document.getElementById('s2').innerText='Q '+(idx+1);document.getElementById('s3').innerText='LVL '+(Math.floor(idx/20)+1);var d=document.getElementById('opts');d.innerHTML='';for(var j=0;j<3;j++){var b=document.createElement('button');b.className='opt';b.innerText=String.fromCharCode(65+j)+') '+cur[j+1];(function(jj,btn){btn.onclick=function(){var all=document.querySelectorAll('.opt');for(var k=0;k<all.length;k++)all[k].onclick=null;if(jj===curCorrect){btn.classList.add('correct');sc+=10;st++;document.getElementById('msg').innerText='✅ SAHI HAI! '+cur[5];if(musicOn)playCorrect();}else{btn.classList.add('wrong');all[curCorrect].classList.add('correct');st=0;document.getElementById('msg').innerText='❌ GALAT! Sahi: '+cur[curCorrect+1]+' - '+cur[5];if(musicOn)playWrong();}document.getElementById('sc').innerText='Score: '+sc;document.getElementById('st').innerText='🔥 '+st;setTimeout(function(){idx++;document.getElementById('msg').innerText='';if(idx%10===0)showCert();load();},1300);};})(j,b);d.appendChild(b);}}
load();
</script></body></html>
