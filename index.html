<script>
var QUESTIONS=[
{q:"Chota Bheem ko kya pasand hai? 😋",o:["Laddoo","Pizza","Burger","Samosa"],a:0},
{q:"Motu ka best friend kaun? 🤝",o:["Patlu","Ghasitaram","Dr.Jhatka","Chingum"],a:0},
{q:"Billi kya bolti hai? 🐱",o:["Meow Meow","Bhow Bhow","Choo Choo","Oink Oink"],a:0},
{q:"Hathi ki naak ko kya kehte? 🐘",o:["Soond","Poonch","Seeng","Kaana"],a:0},
{q:"Ice-cream thandi ya garam? 🍦",o:["Thandi","Garam","Teekhi","Kadvi"],a:0},
{q:"Superman udd sakta hai? 🦸",o:["Haan!","Nahi","Thoda","Raat ko"],a:0},
{q:"Indradhanush me kitne rang? 🌈",o:["7","5","10","3"],a:0},
{q:"A for? 🍎",o:["Apple","Aeroplane","Ant","All - Sab sahi!"],a:3},
{q:"Machli kahan rehti? 🐟",o:["Paani me","Ped par","Ghar me","Hawa me"],a:0},
{q:"Bandar ko kya pasand? 🐒",o:["Kela","Laptop","Jalebi","Chai"],a:0},
{q:"Doraemon ke paas kya? 🤖",o:["Anywhere Door","Lathi","Cycle","Kite"],a:0},
{q:"Gol kya hota? ⚽",o:["Ball","Book","Pen","Table"],a:0},
{q:"Cycle me kitne pahiye? 🚲",o:["2","4","1","10"],a:0},
{q:"Jungle ka raja? 👑",o:["Sher","Billi","Chooha","Kutta"],a:0},
{q:"Teddy soft hota? 🧸",o:["Haan soft","Pathar jaisa","Kaante wala","Paani"],a:0},
{q:"Tom and Jerry me billi? 🐱",o:["Tom","Jerry","Spike","Tyke"],a:0},
{q:"Suraj kab nikalta? ☀️",o:["Subah","Raat","Dopahar raat","Kabhi nahi"],a:0},
{q:"Mickey ka dost? 🐭",o:["Donald Duck","Sher","Haathi","Saanp"],a:0},
{q:"Barish me kya girta? 🌧️",o:["Paani","Laddoo","Paise","Toffee"],a:0},
{q:"1+1=? 🤔",o:["2","11","1","0"],a:0},
{q:"Gaay kya deti? 🐄",o:["Doodh","Cola","Chips","KurKure"],a:0},
{q:"5 ungli ek haath me? ✋",o:["5","10","2","8"],a:0},
{q:"Jalebi shape? 🥨",o:["Gol gol","Chokor","Lamba","Trikon"],a:0},
{q:"Pikachu kaun? ⚡",o:["Pokemon","Digimon","Dog","Cat"],a:0},
{q:"Penguin udd sakta? 🐧",o:["Nahi, tairta hai!","Haan","Thoda","Sunday ko"],a:0}
];
var playerName="HASMAT",current=0,score=0,coins=0,asked=[],TOTAL_PER_LEVEL=10,level=1;
var dhol=document.getElementById('dhol'),correctS=document.getElementById('correctS'),dhol2=document.getElementById('dhol2');
function playDhol(){dhol.currentTime=0;dhol.play().catch(()=>{});setTimeout(()=>dhol2.play().catch(()=>{}),400)}
function startGame(){playerName=document.getElementById('playerName').value||"HASMAT";document.getElementById('startBox').classList.add('hidden');document.getElementById('quizBox').classList.remove('hidden');playDhol();asked=[];current=0;score=0;coins=0;level=1;updateStats();nextQ()}
function updateStats(){document.getElementById('coinBox').innerText=coins;document.getElementById('levelBox').innerText=level;document.getElementById('scoreBoxTop').innerText=score;document.getElementById('scoreBox').innerText="⭐ "+score;document.getElementById('levelText').innerText="Level "+level;document.getElementById('qCount').innerText=(current+1)+"/"+TOTAL_PER_LEVEL}
function nextQ(){if(current>=TOTAL_PER_LEVEL){showLevelUp();return}let idx;do{idx=Math.floor(Math.random()*QUESTIONS.length)}while(asked.includes(idx));asked.push(idx);let q=QUESTIONS[idx];document.getElementById('question').innerText=q.q;updateStats();document.getElementById('bar').style.width=(current/TOTAL_PER_LEVEL*100)+"%";let optDiv=document.getElementById('options');optDiv.innerHTML="";q.o.forEach((op,i)=>{let b=document.createElement('button');b.className="btn opt";b.innerHTML="<span style='background:#ffeaa7;padding:2px 8px;border-radius:8px'>"+String.fromCharCode(65+i)+"</span> "+op;b.onclick=()=>check(i,q.a,b);optDiv.appendChild(b)})}
function check(sel,ans,btn){let btns=document.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);if(sel==ans){btn.classList.add('correct');score++;coins+=10;correctS.play().catch(()=>{});if(Math.random()<0.15){showJackpot();coins+=100}if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance('Shabash Babua, bahut badhiya');u.lang='hi-IN';u.rate=1.1;u.pitch=1.3;speechSynthesis.speak(u);}showShabash()}else{btn.classList.add('wrong');btns[ans].classList.add('correct');if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance('Koi baat nahi babu, agla sahi hoga');u.lang='hi-IN';u.pitch=1.2;speechSynthesis.speak(u);}setTimeout(()=>{let s=document.getElementById('shabash');s.querySelector('.shabash-inner').innerHTML="<div style='font-size:60px'>🤗💛</div><div style='font-size:20px;font-weight:900'>Koi baat nahi Babu! Agla pakka sahi! 💛</div>";s.classList.add('show');setTimeout(()=>{s.classList.remove('show');s.querySelector('.shabash-inner').innerHTML="<div style='font-size:70px'>👶💛</div><div style='font-size:26px;font-weight:900;color:#e17055'>Shabash Babua!</div><div>🌟 Sahi Jawab! 🌟</div><div style='font-size:14px;background:#ffeaa7;padding:4px 10px;border-radius:20px;margin-top:6px'>💰 <span id='shabashCoin'>+10 Coins</span></div><div style='font-size:32px'>🍫🍭🎈</div>"},1200)},200)}updateStats();setTimeout(()=>{current++;nextQ()},1400)}
function showShabash(){document.getElementById('shabashCoin').innerText="+"+10+" Coins = "+coins+" 💰";let s=document.getElementById('shabash');s.classList.add('show');playDhol();setTimeout(()=>s.classList.remove('show'),1600)}
function showJackpot(){let j=document.getElementById('jackpotBox');j.classList.add('show');playDhol();setTimeout(()=>j.classList.remove('show'),2000)}
function showLevelUp(){document.getElementById('quizBox').classList.add('hidden');document.getElementById('levelUpBox').classList.remove('hidden');document.getElementById('levelUpTitle').innerText="Level "+level+" Complete! 🎉";document.getElementById('levelUpMsg').innerText="Wah "+playerName+"! 10 sawal pure!";document.getElementById('levelCoins').innerText=coins;document.getElementById('levelTotalCoins').innerText=coins;playDhol()}
function showSpin(){document.getElementById('levelUpBox').classList.add('hidden');document.getElementById('spinBox').classList.remove('hidden');drawWheel()}
function closeSpinAndNextLevel(){document.getElementById('spinBox').classList.add('hidden');showCert()}
function showCert(){document.getElementById('spinBox').classList.add('hidden');document.getElementById('levelUpBox').classList.add('hidden');document.getElementById('quizBox').classList.add('hidden');document.getElementById('certBox').classList.remove('hidden');document.getElementById('certName').innerText=playerName;document.getElementById('certLevel').innerText=level;document.getElementById('certCoins').innerText=coins;document.getElementById('certScore').innerText=score;document.getElementById('certDate').innerText=new Date().toLocaleDateString('hi-IN',{day:'numeric',month:'long',year:'numeric'})+" | HASMAT KIDS";playDhol()}
function nextLevel(){level++;current=0;document.getElementById('certBox').classList.add('hidden');document.getElementById('quizBox').classList.remove('hidden');updateStats();nextQ();playDhol()}
var angle=0,prizes=["💰 20 Coins","🍫 Chocolate","🎁 Gift +10","💎 50 Jackpot!","🍭 Lollipop","🎈 15 Coins","🍦 Ice Cream","😊 +5 Bonus"];
function drawWheel(){let c=document.getElementById('spinCanvas'),ctx=c.getContext('2d');ctx.clearRect(0,0,320,320);for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(160,160);ctx.arc(160,160,135,angle+i*Math.PI/4,angle+(i+1)*Math.PI/4);ctx.closePath();ctx.fillStyle=['#ffe66d','#ff6b6b','#48dbfb','#1dd1a1','#f368e0','#ff9f43','#00d2d3','#fab1a0'][i];ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(160,160);ctx.rotate(angle+i*Math.PI/4+Math.PI/8);ctx.fillStyle="#2d3436";ctx.font="900 11px sans-serif";ctx.fillText(prizes[i],35,4);ctx.restore()}ctx.beginPath();ctx.arc(160,160,28,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();ctx.strokeStyle="#fdcb6e";ctx.lineWidth=4;ctx.stroke();ctx.fillStyle="#e17055";ctx.font="900 10px sans-serif";ctx.fillText("HASMAT",135,165)}
function spinWheel(){let btn=document.getElementById('spinBtn');btn.disabled=true;let final=angle+Math.random()*10+10;let start=angle,startTime=null;function anim(t){if(!startTime) startTime=t;let p=Math.min((t-startTime)/3000,1);let ease=1-Math.pow(1-p,3);angle=start+(final-start)*ease;drawWheel();if(p<1)requestAnimationFrame(anim);else{let idx=Math.floor((8-(angle%(Math.PI*2))/(Math.PI/4))%8);let prize=prizes[idx];let add=0;if(prize.includes('20')) add=20;else if(prize.includes('50')) add=50;else if(prize.includes('15')) add=15;else if(prize.includes('10')) add=10;else if(prize.includes('5')) add=5;else add=10;coins+=add;document.getElementById('spinResult').innerText="Jeeta: "+prize+" +"+add+" Coins! 🎉";document.getElementById('coinBox').innerText=coins;if(prize.includes('Jackpot')){showJackpot();coins+=50}btn.disabled=false;playDhol()}}requestAnimationFrame(anim)}
drawWheel();
</script></body></html>
