<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero se Hero - Desi Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:linear-gradient(135deg,#0f0f23,#1a1a40);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.game{width:100%;max-width:420px;background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:20px;box-shadow:0 20px 40px rgba(0,0,0,0.3)}
h1{text-align:center;font-size:28px;background:linear-gradient(45deg,#ffd700,#ff6b00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
.sub{text-align:center;opacity:0.7;margin-bottom:20px;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.stat{background:rgba(255,255,255,0.08);padding:12px;border-radius:12px;text-align:center}
.stat b{display:block;font-size:22px;color:#ffd700}
.stat span{font-size:11px;opacity:0.7}
.progress{height:8px;background:rgba(255,255,255,0.1);border-radius:10px;overflow:hidden;margin-bottom:20px}
.bar{height:100%;width:10%;background:linear-gradient(90deg,#ffd700,#ff6b00);transition:0.5s}
.question{background:rgba(255,255,255,0.08);padding:15px;border-radius:12px;margin-bottom:15px;font-size:18px;font-weight:600}
.options{display:grid;gap:10px}
.btn{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:white;padding:14px;border-radius:12px;font-size:16px;cursor:pointer;transition:0.2s}
.btn:active{transform:scale(0.97)}
.btn.correct{background:#00c853;border-color:#00c853}
.btn.wrong{background:#d50000;border-color:#d50000}
.footer{text-align:center;margin-top:20px;opacity:0.5;font-size:12px}
</style>
</head>
<body>
<div class="game">
<h1>ZERO SE HERO</h1>
<p class="sub">Desi Knowledge Challenge 🔥</p>
<div class="stats">
<div class="stat"><b id="score">0</b><span>SCORE</span></div>
<div class="stat"><b id="level">1</b><span>LEVEL</span></div>
<div class="stat"><b id="coins">0</b><span>COINS</span></div>
</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="q">Loading...</div>
<div class="options" id="opts"></div>
<div class="footer">Made by Hasmat Ali • Level up to become Hero!</div>
</div>
<script>
const questions=[
{q:"India ka National Game kya hai?",a:["Hockey","Cricket","Kabaddi","Football"],c:0},
{q:"Chai me sabse zyada kya use hota hai?",a:["Pani","Doodh","Chini","Patti"],c:3},
{q:"Bollywood ka Baap kaun?",a:["SRK","Salman","Amitabh","Akshay"],c:2},
{q:"Zero kisne khoja?",a:["Aryabhata","Newton","Einstein","Tesla"],c:0},
{q:"Free Fire me Booyah ka matlab?",a:["Jeet","Haar","Draw","Start"],c:0},
{q:"Instagram kisne banaya?",a:["Mark","Kevin Systrom","Elon","Bill"],c:1},
{q:"1GB me kitne MB hote hain?",a:["100","1000","1024","512"],c:2},
{q:"Desi jugaad ka matlab?",a:["Paisa","Trick se kaam","Gaadi","Khana"],c:1},
{q:"YouTube pe sabse zyada kya dekha jata hai?",a:["Music","Comedy","Gaming","Study"],c:0},
{q:"Hero banne ke liye kya chahiye?",a:["Paisa","Mehnat","Kismat","Sab kuch"],c:3},
];
let idx=0,score=0,level=1,coins=0;
const qEl=document.getElementById('q'),optsEl=document.getElementById('opts'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),coinsEl=document.getElementById('coins'),barEl=document.getElementById('bar');
function load(){
if(idx>=questions.length){idx=0;level++;levelEl.textContent=level;alert("Level Up! Ab tu Level "+level+" pe hai 🔥");}
const cur=questions[idx];
qEl.textContent=(idx+1)+". "+cur.q;
optsEl.innerHTML="";
cur.a.forEach((opt,i)=>{
const b=document.createElement('button');
b.className='btn';b.textContent=opt;
b.onclick=()=>check(i,b);
optsEl.appendChild(b);
});
barEl.style.width=((idx/questions.length)*100)+"%";
}
function check(i,btn){
const cur=questions[idx];
const all=document.querySelectorAll('.btn');
if(i===cur.c){
btn.classList.add('correct');score+=10;coins+=5;scoreEl.textContent=score;coinsEl.textContent=coins;
}else{
btn.classList.add('wrong');all[cur.c].classList.add('correct');
}
setTimeout(()=>{idx++;load();},800);
}
load();
</script>
</body>
</html>
