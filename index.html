<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Se Hero - FINAL ALL FIX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0a0a1f;color:#fff}
.app{max-width:430px;margin:0 auto;background:#121233;min-height:100vh;padding-bottom:100px}
.cover{width:100%;height:220px;object-fit:cover}.logo{width:110px;height:110px;border-radius:50%;border:4px solid gold;margin:-55px auto 8px;display:block;object-fit:cover}
.title{text-align:center;color:gold;font-size:26px;font-weight:900}.sub{text-align:center;opacity:.7;font-size:11px;margin-bottom:8px}
.card{margin:12px;background:#1e1e4a;border-radius:18px;padding:15px;border:1px solid rgba(255,255,255,.15)}
.bar{height:8px;background:rgba(255,255,255,.15);border-radius:10px;overflow:hidden}.bar div{height:100%;background:gold;width:0%;transition:.4s}
.info{display:flex;justify-content:space-between;font-size:13px;margin:12px 0;font-weight:800}
.qtext{font-weight:800;min-height:60px;font-size:17px;margin:10px 0;line-height:1.35}
.opt{width:100%;padding:14px;margin:6px 0;border-radius:12px;background:#2c2c6a;border:1px solid #555;color:#fff;text-align:left;font-size:15px;font-weight:700}
.opt.green{background:#00c853!important;border:2px solid #fff;color:#fff}.opt.red{background:#d50000!important}
.msg{text-align:center;font-weight:800;color:#ffd700;margin-top:10px;min-height:24px;font-size:13px}
.slotbox{display:flex;gap:6px;justify-content:center;margin:10px 0}.slot{background:gold;color:#000;padding:6px 10px;border-radius:8px;font-weight:900;font-size:11px}
#certModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.88);z-index:1000;justify-content:center;align-items:center;padding:15px}
.certBox{background:linear-gradient(135deg,#fff,#ffeaa7);color:#000;border-radius:20px;max-width:380px;width:100%;border:4px solid gold;overflow:hidden}
.certHeader{background:#0a0a1f;color:gold;padding:10px;display:flex;justify-content:space-between;align-items:center}
.certHeader img{width:38px;height:38px;border-radius:50%;border:2px solid gold;object-fit:cover}
.certBody{padding:18px;text-align:center}.shayari{background:linear-gradient(90deg,#fdcb6e,#ffeaa7);border-left:4px solid #e17055;padding:10px;border-radius:10px;font-style:italic;font-weight:800;font-size:13px;margin:12px 0;white-space:pre-line;color:#222}
.btnGold{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(90deg,gold,orange);font-weight:900;margin-top:8px;font-size:15px}
.musicBtn{position:fixed;bottom:18px;right:18px;background:gold;color:#000;width:60px;height:60px;border-radius:50%;border:none;font-size:28px;z-index:999;box-shadow:0 4px 15px rgba(0,0,0,.5)}
.enableBox{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.92);z-index:2000;display:flex;justify-content:center;align-items:center;padding:20px}
.enableCard{background:#1e1e4a;border:2px solid gold;border-radius:18px;padding:22px;text-align:center;max-width:320px}
</style>
</head>
<body>
<div id="enableBox" class="enableBox">
<div class="enableCard">
<div style="font-size:50px">🔊🎵</div>
<h2 style="color:gold;margin:10px 0">Sound ON karo Babua!</h2>
<p style="font-size:13px;opacity:.8;margin-bottom:12px">iPhone pe music ke liye ek baar tap karna padta hai, uske baad har quiz pe sound bajega!</p>
<button class="btnGold" onclick="enableSound()">🔊 SOUND ON + START HERO JOURNEY 🚀</button>
</div>
</div>
<div class="app">
<img class="cover" src="IMG_7295.jpeg?v=FINAL"><img class="logo" src="IMG_7296.jpeg?v=FINAL">
<h1 class="title">ZERO TO HERO</h1><p class="sub">150 UNIQUE • GREEN/RED FIXED • MUSIC FIXED 🔥</p>
<div class="card">
<div class="bar"><div id="bar"></div></div>
<div class="info"><span id="qno">1/150</span><span id="sc">Score:0</span><span id="st">🔥0</span></div>
<div class="slotbox"><div class="slot" id="s1">SLOT 1</div><div class="slot" id="s2">Q 1</div><div class="slot" id="s3">LVL 1</div></div>
<div class="qtext" id="qt">Loading...</div>
<div id="opts"></div>
<div class="msg" id="msg"></div>
</div>
</div>
<div id="certModal"><div class="certBox">
<div class="certHeader"><img src="IMG_7296.jpeg?v=FINAL"><h3>⭐ ZERO SE HERO ⭐</h3><img src="IMG_7295.jpeg?v=FINAL" style="border-radius:8px"></div>
<div class="certBody">
<div style="font-size:42px">🏆</div><h2 style="color:#d63031;font-size:18px">HERO CERTIFICATE</h2>
<div style="font-size:20px;font-weight:900;color:#d63031" id="cName">BABUA HERO - <span id="cQuiz">10</span> Quiz Complete!</div>
<div style="font-size:18px;font-weight:900;color:#00b894" id="cScore"></div>
<div class="shayari" id="shayari"></div>
<button class="btnGold" onclick="document.getElementById('certModal').style.display='none'">🚀 Aage Badho Hero!</button>
</div>
</div></div>
<button class="musicBtn" id="mBtn" onclick="toggleMusic()">🔊i</button>
